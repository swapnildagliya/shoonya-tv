<style>/* inlined from ../../../colors_and_type.css — do not edit here, edit the source */
/* =====================================================================
   Shoonya Design System — Foundations
   Colors, type, spacing, marks. Drop this CSS in any artifact and
   import the same fonts. Two foundations (black / bone #F4F1EB; pure
   white is for cards/elevated only — D-071). One vibrant per design.
   Never both vibrants in the same frame.
   ===================================================================== */

/* --- Web fonts -------------------------------------------------------- */
/* Playfair Display — local TTFs, weights 400/500/600 + italics in use.
   Black / Bold / ExtraBold are loaded for completeness but the system
   restricts headlines to Medium 500 (per the spec). */

/* Inter — local TTFs, graphics/system weights 400 and 500 only. */

/* =====================================================================
   W1 type-voice menu — added 2026-09-03, updated 2026-09-03 after the
   rendered proofs (D-117, amends D-036/D-038/D-042/D-109). Additive
   only: no existing selector, default font-family, or token value
   above this block is touched. Web pages keep Inter / PT Serif /
   Marcellus untouched. Variable fonts: woff2 first, ttf fallback, real
   weight axis per fonts/SOURCES.md.

   Proof outcome: Archivo (condensed cut) wins movement/reels — Bricolage
   Grotesque had no italic cut (the proof showed a browser-faked slant)
   and retires; its @font-face is removed here (file stays on disk,
   see docs/type-library.md § Retired faces). The structure-face swap
   to Instrument Sans showed no visible gain across the ~3,950 graphics
   declarations — Inter stays the structure face; Instrument Sans keeps
   its @font-face as an opt-in alternate, never a silent default.
   ===================================================================== */

/* Fraunces — Shoonya display, warm/community voice (ratified D-117).
   Variable weight axis 100–900 (also carries an optical-size axis,
   not addressed via font-weight). */

/* Instrument Sans — graphics structure face, OPT-IN ALTERNATE ONLY
   (ratified D-117 as available, never a silent default — the proof
   showed no visible gain over Inter for the default role). Use only
   where a surface has a documented reason in its own README.
   Variable weight axis 400–700. */

/* Geist Mono — system-wide data face: times, prices, dates, schedule
   cells, countdowns (ratified D-117). JetBrains Mono and IBM Plex Mono
   retire from this role. Variable weight axis 100–900. */

/* Archivo — Shoonya display, movement/reels voice (ratified D-117,
   won the 2026-09-03 proof against Bricolage Grotesque). Movement
   headlines use the CONDENSED cut: font-weight 700 + font-stretch 75%
   (real condensed axis, not a synthetic squeeze), with a genuine
   italic — the property Bricolage Grotesque lacked. Variable weight
   axis 100–900, width axis 62–125% (75% = condensed). */

:root {
  /* ------- Foundations (the two grounds) ------------------------------ */
  --void-black: #000000;       /* Foundation A — depth, ceremony, focus   */
  --bone:       #F4F1EB;       /* Foundation B — warm light ground / default (D-071) */
  --void-white: #FFFFFF;       /* Cards / elevated layers on bone only (D-071)        */

  /* ------- Neutrals --------------------------------------------------- */
  --mist:     #D6D6D6;         /* Dividers, secondary surfaces            */
  --charcoal: #4A4A4A;         /* Body on white when pure black too heavy */

  /* ------- The vibrant palette (one per design only) ------------------ */
  --vibrant-purple: #B564F7;   /* Shoonya Dance Centre                    */
  --vibrant-pink:   #EEAACF;   /* social / GIDF opening-party tint        */
  --vibrant-saffron:#E85D1F;   /* @swapkebolly — personal voice   */
  --vibrant-yellow: #FBC70F;   /* ABC a Bollywood Company                 */
  --vibrant-teal:       #6FB7B1; /* Ghent Tap Festival (D-008)            */
  --vibrant-pomegranate:#C13B5A; /* Leylet Raqs (D-009, ratified)         */
  --vibrant-coral:      #F25A4C; /* Social Nights — single signature (D-040) */
  --abc-tint:           #FFCF5A; /* ABC soft web tint — NOT a vibrant (D-005) */

  /* ------- @swapkebolly act palette (D-096) --------------------------- */
  /* No single vibrant — one colour per act, from the live site. oklch    */
  /* verbatim, never converted to hex (D-081). Bold orange is excluded.   */
  --sw-cobalt:   oklch(0.50 0.21 264);  /* Live dates · Hello · default   */
  --sw-marigold: oklch(0.85 0.16 84);   /* Workshops — carries ink text   */
  --sw-pink:     oklch(0.60 0.19 350);  /* Invitation                     */
  --sw-indigo:   oklch(0.20 0.06 295);  /* Body                           */
  --sw-cream:    oklch(0.955 0.02 85);  /* Classes                        */
  --sw-blush:    oklch(0.93 0.035 25);  /* Table                          */

  /* ------- Operational schedule/form exception (D-070) --------------- */
  --operational-paper: #F0EDE8;  /* App/form/schedule shell only — not a brand foundation */
  --cat-partner:   var(--void-black);       /* Partner & Social category dot */
  --cat-technique: #E85D1F;                 /* Classical & Technique category dot — own literal, NOT the brand token (D-070/D-096) */
  --cat-culture:   var(--vibrant-purple);   /* Culture & Wellness category dot */

/* =====================================================================

   ===================================================================== */
html { -webkit-text-size-adjust: 100%; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--fg-2);
  font-family: var(--font-body);
  font-size: var(--type-body);
  line-height: var(--leading-body);
  font-weight: 400;
  font-feature-settings: "kern", "liga", "tnum";
  -webkit-font-smoothing: antialiased;
}

h1, h2, h3, .display, .hero {
  font-family: var(--font-display);
  font-weight: 500;
  color: var(--fg-1);
  line-height: var(--leading-tight);
  letter-spacing: -0.005em;
  margin: 0;
}

.hero    { font-size: var(--type-hero); }
h1, .h1  { font-size: var(--type-h1); }
h2, .h2  { font-size: var(--type-h2); }
h3, .h3  { font-size: var(--type-h3); line-height: var(--leading-snug); }

.subhead, .sub {
  font-family: var(--font-display);
  font-style: italic;
  font-weight: 400;
  font-size: var(--type-sub);
  line-height: var(--leading-snug);
  color: var(--fg-1);
}

p, .body {
  font-family: var(--font-body);
  font-size: var(--type-body);
  line-height: var(--leading-body);
  color: var(--fg-2);
  max-width: 60ch;
}

small, .body-sm { font-size: var(--type-body-sm); }

/* Caption / eyebrow — always all caps, tracked, Inter Medium */
.caption, .eyebrow {
  font-family: var(--font-body);
  font-weight: 500;
  font-size: var(--type-caption);
  letter-spacing: var(--tracking-caption);
  text-transform: uppercase;
  color: var(--fg-1);
}
.eyebrow { letter-spacing: var(--tracking-eyebrow); font-size: var(--type-eyebrow); }

/* Numerals — tabular for schedules, lining Playfair for editorial */
.tabular { font-variant-numeric: tabular-nums; }
.editorial-num { font-family: var(--font-display); font-variant-numeric: lining-nums; }

/* Links — vibrant by default, underline on hover (no fill) */
a {
  color: var(--vibrant);
  text-decoration: none;
  border-bottom: var(--hairline) solid currentColor;
  transition: opacity var(--duration-fast) var(--ease);

/* Hairline rule */
hr {
  border: 0;
  border-top: var(--hairline) solid var(--rule);
  margin: var(--space-5) 0;
}

/* Quote — Playfair italic, generous left padding, no quotation marks */

  font-family: var(--font-display);
  font-style: italic;
  font-weight: 400;
  font-size: var(--type-h3);
  line-height: var(--leading-snug);
  color: var(--fg-1);
  margin: 0;
  padding-left: var(--space-3);

/* =====================================================================

   ===================================================================== */
.btn {
  display: inline-flex;
  align-items: center;
  gap: var(--space-1);
  padding: 14px 22px;
  font-family: var(--font-body);
  font-weight: 500;
  font-size: 14px;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  background: transparent;
  color: var(--fg-1);
  border: var(--line) solid var(--fg-1);
  border-radius: var(--radius-0);
  cursor: pointer;
  transition: background var(--duration-base) var(--ease),
              color var(--duration-base) var(--ease);
}
.btn:hover  { background: var(--vibrant); color: var(--void-black); border-color: var(--vibrant); }
.btn:active { transform: none; opacity: 0.85; }

.btn--vibrant { background: var(--vibrant); color: var(--void-black); border-color: var(--vibrant); }
.btn--vibrant:hover { background: transparent; color: var(--fg-1); border-color: var(--fg-1); }

.btn--pill { border-radius: var(--radius-pill); padding: 12px 26px; }

/* Card — gallery-flat. 0.5px mist border, no shadow. */
.card {
  background: var(--bg);
  border: var(--hairline) solid var(--mist);
  padding: var(--space-3);
}

/* Input — single underline, no fill */
.input {
  display: block;
  width: 100%;
  padding: 10px 0;
  background: transparent;
  border: 0;
  border-bottom: var(--line) solid var(--fg-1);
  font-family: var(--font-body);
  font-size: 16px;
  color: var(--fg-1);
  outline: none;
  transition: border-color var(--duration-base) var(--ease);

.input::placeholder { color: var(--fg-3); }
.input:focus { border-color: var(--vibrant); }

/* Dot — the bindu */
.bindu {
  display: inline-block;
  width: 6px; height: 6px;
  border-radius: 50%;
  background: currentColor;
  vertical-align: middle;
  margin: 0 0.5em;
}

/* =====================================================================
   Interaction states (D-097) — focus · disabled · loading · error.
   The system shipped none of these until 2026-08-19: `.input` actively
   removed the focus ring with `outline: none` and `.btn` had hover and
   active but no focus at all, so keyboard users got nothing designed.
   They live here so every surface inherits them instead of each page
   remembering to reimplement them.
   ===================================================================== */

/* --- Focus ----------------------------------------------------------
   Keyboard focus only (:focus-visible) — never a ring on mouse click.
   2px vibrant with a 2px offset, so the ring reads against both
   foundations. The offset also saves a vibrant-filled control: the ring
   lands on the ground behind it, not on its own fill. If a control ever
   does sit on its own vibrant plane, override outline-color to
   var(--fg-1) locally. */
a:focus-visible,
button:focus-visible,
.btn:focus-visible,
.icon-btn:focus-visible,
[role="button"]:focus-visible,
input:focus-visible,
.input:focus-visible,
select:focus-visible,
textarea:focus-visible,
summary:focus-visible,
[tabindex]:focus-visible {
  outline: 2px solid var(--vibrant);
  outline-offset: 2px;
}

/* --- Disabled -------------------------------------------------------
   Stated in palette, not in opacity: tertiary ink on a mist hairline.
   Hover is neutralised so a disabled control never previews an action. */
.btn:disabled,
.btn[aria-disabled="true"],
.btn:disabled:hover,
.btn[aria-disabled="true"]:hover {
  background: transparent;
  color: var(--fg-3);
  border-color: var(--mist);
  cursor: not-allowed;
}
.input:disabled {
  color: var(--fg-3);
  border-bottom-color: var(--mist);
  cursor: not-allowed;
}

/* --- Loading --------------------------------------------------------
   No spinner: the bindu is the system's own waiting mark. */
.is-loading {
  color: var(--fg-3);
  cursor: progress;
  pointer-events: none;
}
.bindu--pulse { animation: binduPulse 1.1s var(--ease) infinite; }
@keyframes binduPulse { 0%, 100% { opacity: 0.25; } 50% { opacity: 1; } }

/* --- Error ----------------------------------------------------------
   Palette-pure, per the D-068 documentation convention: a solid black ✕
   badge and ink type — never an off-palette red, and never the vibrant,
   which is the brand accent and would read as emphasis, not fault. */
.input[aria-invalid="true"] {
  border-bottom-width: 2px;
  border-bottom-color: var(--fg-1);
}
.field-error {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-top: 8px;
  font-family: var(--font-body);
  font-weight: 500;
  font-size: var(--type-caption);
  letter-spacing: var(--tracking-caption);
  color: var(--fg-1);
}
.field-error::before {
  content: "✕";
  display: inline-grid;
  place-items: center;
  flex: 0 0 auto;
  width: 16px;
  height: 16px;
  background: var(--fg-1);
  color: var(--bg);
  font-size: 10px;
}

/* --- Reduced motion -------------------------------------------------
   D-037 calls prefers-reduced-motion mandatory in both motion classes.
   Until now the system delivered it nowhere and every page had to
   remember it. Now the floor is global; surfaces may still add their
   own richer reduced-motion handling on top. */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
    scroll-behavior: auto !important;
  }
}
</style>

   Chips, stamps, bands, countdowns: solid-vibrant planes that give a frame
   its detailing without breaking one-vibrant (D-035), sharp corners, or the

   slips past the global `!important` in a future edit.

  .accordion,

  .icon-swap__icon,

  .stagger {

    animation: none !important;

  .press:active, [data-press]:active { transform: none !important; }
  .stagger { opacity: 1 !important; transform: none !important; }
}

   ([data-fill]) override to solid fill; see the modifier below. */

  display: inline-block;
  width: 1em;
  height: 1em;

  stroke-linejoin: miter;
  stroke-linecap: square;

   not strokes — see icons.svg symbols marked data-fill="true" and
   README.md. Applying `.icon` to one of those still works (fill inherits
   currentColor from the symbol's own paths), this modifier is for the
   ACTIVE-STATE fill case in the rule below. */
.icon--fill,
.icon[data-active="true"] {

  stroke: none;

<div id="stage">

  <div class="boards">

  <!-- ═══ BOARD 1 · featured event + what else is on ═══ -->

    <!-- LEFT · the featured event — two layers for the cross-fade -->

      <div class="hero-layer is-active" id="hero-a"></div>
      <div class="hero-layer" id="hero-b"></div>

<script>
'use strict';

/* ════════════════════════════════════════════════════════════════════════
   CONFIG — the only block you should need to touch.
   The feed is the link-in-bio's own events list, republished as JSON beside
   it by projects/shoonya/social-media/links-in-bio/build-events-feed.mjs.
   One list, one deploy, no second source to keep in step.
   Payload: an array (or {events:[...]}) of objects:
     { id, title, host, location, image, url, start_time, end_time,
       start_known, end_known, multi_day, date_label, description, price, cta }
   start_time / end_time = ISO 8601. See events.sample.json.
   ═══════════════════════════════════════════════════════════════════════ */
const CONFIG = {
  API_URL: 'https://links.shoonyadance.com/events.json',
  POLL_MS: 60 * 1000,        // re-fetch cadence
  SWEEP_MS: 15 * 1000,       // local expiry sweep between fetches
  PAGE_SIZE: 5,              // rows per overview page — five readable rows at 5–8 m
  /* How far ahead the board gives events a full-screen slide. All 27 upcoming
     events was a seven-minute lap, which meant the season opener — the thing
     the board most wants people to see — came back round once every seven
     minutes. Twelve is three pages, a ~3.5 minute lap, and the far-future
     entries (a festival in May 2027) lose nothing by waiting: the overview
     still counts them, and they move up the list as their date approaches.
     null = every upcoming event. KEEP IT A MULTIPLE OF PAGE_SIZE — 12 leaves a
     final page holding one hero and one row, which reads as a mistake. */
  ROTATION_LIMIT: 15,
  /* Demo data is a DEVELOPMENT aid only. build.mjs forces this to false for
     the deployed board: once a real endpoint exists, a screen in a public
     studio must never show invented event names — someone will read them and
     believe them. Production shows an honest "feed unavailable" instead. */
  DEMO_FALLBACK: false,   // forced off by build.mjs

  /* Which event holds the top of the list. An ID only — the board carries no
     event copy of its own. A sentence written in here cannot be corrected
     without a redeploy, and nobody editing the link-in-bio would ever find
     it; the board line belongs in the feed (D-108). */
  FEATURED_ID: 'opendeurdag-sep',
  AVAILABLE_BOARDS: ['events', 'detail', 'timetable'],
  OVERVIEW_MS: 20 * 1000,
  DETAIL_MS: 10 * 1000,
  /* Longer than a detail slide: this one is a table somebody reads, not a
     card they glance at. */
  TIMETABLE_MS: 26 * 1000,
  /* The closing run: productions and festivals that would otherwise sit months
     down a chronological list and never reach a screen. A touch longer than a
     normal slide — these are the ones worth stopping for. */
  HIGHLIGHT_MS: 13 * 1000,
  SAFE_SCALE: 0.92,

  /* A ten-week course would otherwise hold the featured slot for ten weeks —
     it is "happening now" every day of its run — and push tonight's social
     into the list. The hero is for what happens in this building soon, so
     multi-day runs stay in the lineup. Set false to let them lead again. */
  HERO_SINGLE_ONLY: true
};

/* ── State ─────────────────────────────────────────────────────────────── */
const state = {
  events: [],          // normalized, sorted by start
  source: 'none',      // 'live' | 'stale' | 'demo' | 'none'
  gridKey: '',
  detailKey: '',
  featuredId: null,
  activeLayer: 'a',
  rotationEvents: [],
  allEvents: [],       // every upcoming event, in the order the board walks them
  page: 0,
  pageCount: 1,
  highlights: [],
  phase: 'pages',      // 'pages' → the paged walk · 'highlights' → the closing run
  highlightIndex: 0,
  images: null,        // id → the photograph this event owns on this screen
  storyIndex: 0,
  boardTimer: null,
  board: null,
  /* PROOF · E — true for exactly the first render() call this session.
     Gates .stagger (motion-primitives.css, first-load only, per the
     frequency-gate comment in the #proof style block) — flipped false at
     the end of render() and never set back to true, so a page turn /
     expiry sweep / highlight lap never re-triggers the entrance. */
  firstPaint: true
};

/* ── Data engine ───────────────────────────────────────────────────────── */
function normalize(payload) {
  const raw = Array.isArray(payload) ? payload : (payload && payload.events) || [];
  return raw
    .map(e => {
      const start = Date.parse(e.start_time || e.start || '');
      const end = Date.parse(e.end_time || e.end || '');
      if (!e.title || isNaN(start) || isNaN(end)) return null;
      return {
        id: String(e.id != null ? e.id : e.title + '|' + start),
        title: String(e.title),
        // The board line — one sentence from the event's live page, carried
        // in the feed as `description` / `board_line` (/event-launch Step 1).
        description: String(e.description || e.board_line || '').trim(),
        /* Price and CTA in the organiser's exact wording. A caption-less TV
           surface has to carry the practical detail itself (D-023 · D-049),
           so the single-event board renders these when the feed supplies
           them — and omits them silently when it does not. Never invented,
           never reformatted. */
        price: String(e.price || '').trim(),
        cta: String(e.cta || '').trim(),
        host: e.host ? String(e.host) : '',
        location: e.location ? String(e.location) : '',
        image: e.image || e.image_url || '',
        /* A pool, not a picture. Recurring series (five Salsa nights, three
           Kizomba nights) used to publish one frame each, so the board showed
           the same photograph four rows apart and read as broken. The feed
           now offers every usable frame and the board picks one that is not
           already on screen — see assignImages(). */
        /* A featured event can carry motion instead of a still. The board is a
           web page, so this is a <video> in the same box the photograph used —
           the studio-TV doctrine has preferred video since 2026-06-11. The
           still stays on as the poster, so a video that fails to load or a
           viewer who asked for reduced motion still sees the right picture. */
        video: e.video || '',
        highlight: e.highlight === true,
        /* A day-programme. Only ever used on the day itself. */
        programme: (e.programme && Array.isArray(e.programme.blocks)) ? e.programme : null,
        images: Array.isArray(e.images) && e.images.length
          ? e.images.slice()
          : (e.image || e.image_url ? [e.image || e.image_url] : []),
        /* What the feed knows about the clock. An event published as a date
           with no time arrives with these false, and every renderer below
           then shows the date alone — a wall screen must not state a time
           nobody wrote down. Feeds that omit the flags keep the old
           behaviour: a stated start and end, both trusted. */
        startKnown: e.start_known !== false,
        endKnown: e.end_known !== false,
        multiDay: e.multi_day === true,
        dateLabel: String(e.date_label || '').trim(),
        start, end
      };
    })
    .filter(Boolean)
    .sort((a, b) => a.start - b.start);
}

async function fetchEvents() {
  try {
    const res = await fetch(CONFIG.API_URL, { cache: 'no-store' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    state.events = normalize(await res.json());
    state.source = 'live';
  } catch (err) {
    if (state.source === 'live' || state.source === 'stale') {
      state.source = 'stale';           // keep last good data on screen
    } else if (CONFIG.DEMO_FALLBACK) {
      state.events = demoEvents();
      state.source = 'demo';
    } else {
      state.events = [];                // say so honestly; never invent
      state.source = 'error';
    }
  }
  render();
}

/* Demo data — clearly badged on screen; times are relative so it always
   demonstrates the full lifecycle (first event expires ~2 min after load). */
function demoEvents() {
  const now = Date.now();
  const H = 3600e3, D = 24 * H;
  const mk = (title, description, startOffset, durH, initial) => ({
    id: 'demo-' + title,
    title, description,
    price: 'Demo price · €0',
    cta: 'Demo CTA',
    host: 'Demo data',
    location: 'Stapelplein 41, Gent',
    image: '',
    startKnown: true, endKnown: true, multiDay: false, dateLabel: '',
    start: now + startOffset,
    end: now + startOffset + durH * H,
    initial
  });
  return [
    mk('Salsa & Bachata Social', 'Demo board line — one sentence pulled from the event page.', -2 * H + 2 * 60e3, 2, 'S'),
    mk('Bollywood Beginners', 'Demo board line — one sentence pulled from the event page.', 3 * H, 1.5, 'B'),
    mk('Kathak Intensive', 'Demo board line — one sentence pulled from the event page.', 1 * D + 2 * H, 2, 'K'),
    mk('Lindy Hop Taster', 'Demo board line — one sentence pulled from the event page.', 2 * D + 4 * H, 1.5, 'L'),
    mk('Flamenco Workshop', 'Demo board line — one sentence pulled from the event page.', 4 * D, 2, 'F'),
    mk('Kizomba Night', 'Demo board line — one sentence pulled from the event page.', 5 * D + 3 * H, 3, 'K'),
    mk('Contemporary Lab', 'Demo board line — one sentence pulled from the event page.', 6 * D, 2, 'C'),
    mk('Tap Jam Session', 'Demo board line — one sentence pulled from the event page.', 8 * D, 2, 'T')
  ].sort((a, b) => a.start - b.start);
}

/* ── Formatting ────────────────────────────────────────────────────────── */
const MONTHS = ['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
const DAYS = ['SUNDAY','MONDAY','TUESDAY','WEDNESDAY','THURSDAY','FRIDAY','SATURDAY'];

function fmtTime(ts) {
  const d = new Date(ts);
  return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
}
function fmtHMS(ms) {
  if (ms >= 24 * 3600e3) {
    const days = Math.round(ms / (24 * 3600e3));
    return days + (days === 1 ? ' day' : ' days');
  }
  const s = Math.max(0, Math.floor(ms / 1000));
  const pad = n => String(n).padStart(2, '0');

   "Free" and every other walk-in line stay bare. Positive gate, EN + NL. */

/* ═══ PROOF · A/D — data-face sizing + the ≥64px display-tracking rule ═══

function chipHTML(ts, extraClass) {

    '<span class="day">' + d.getDate() + '</span>' +
    '<span class="month">' + MONTHS[d.getMonth()] + '</span>' +
  '</span>';
}
/* "7 NOV" — the unit a range is built from. */

     above drops the end and reads as its other half (D-024). */
  /* dateOnChip: the photo already carries the start date as a stamped chip,
     so printing it again here is the same fact twice (D-024). The line keeps
     the half the chip cannot show — where the run ends, which weekday it is,
     what time it starts. */
  /* PROOF · C — i-calendar when there is no clock to point at (a run, or a

  const icon = iconHTML((ev.multiDay || !ev.startKnown) ? 'calendar' : 'clock');

    return icon + (hideEnd ? '<b>From ' + fmtDayMon(ev.start) + '</b>'
      : dateOnChip ? '<b>till ' + fmtDayMon(ev.end) + '</b>'
      : '<b>' + fmtDayMon(ev.start) + ' – ' + fmtDayMon(ev.end) + '</b>');

/* A feed's date label is written for a link list, so it often restates the

   Reprinting it under the title is the classic each-fact-twice slip (D-024).
   Keep the label only when it says something the time line does not — a
   course's weekly slot, a DJ line-up, who is teaching. */
/* PROOF · 2026-09-05 — Swapnil: "Salsa & Bachata social night could have had
   more information in the subline." The original dropped the WHOLE label
   whenever any fragment repeated a time already on the row — "Solo Salsa with
   Gheorghe & Timea · social till 01:00" lost the workshop and the teachers
   over "01:00". Now only the repeating fragment goes; the rest stays. */
function labelKept(ev) {
  if (!ev.dateLabel) return '';

  const shown = [];
  if (ev.startKnown) shown.push(fmtTime(ev.start));
  if (ev.endKnown) shown.push(fmtTime(ev.end));

function labelAddsSomething(ev) { return labelKept(ev).length > 0; }


/* Type-set date — the lineup rows. No year: on a board showing the next
   fortnight it repeats on every row and says nothing (D-024). */
function dateTypeHTML(ts) {
  const d = new Date(ts);
  return '<span class="date-type">' +
    '<span class="day">' + d.getDate() + '</span>' +
    '<span class="month">' + MONTHS[d.getMonth()] + '</span>' +
  '</span>';
}

/* Give every event on screen a photograph nobody else on screen is using.
   Walks the list in display order; each event takes the first frame from its
   own pool that is still free, and falls back to its first frame only when
   the pool is exhausted — a repeat is better than a blank, but it is the
   last resort rather than the default. Deterministic: same list in, same
   pictures out, so a re-render never reshuffles the board. */
function assignImages(list) {
  const used = new Set();
  const picked = new Map();
  list.forEach(ev => {
    const pool = ev.images && ev.images.length ? ev.images : (ev.image ? [ev.image] : []);
    const free = pool.find(src => !used.has(src));
    const chosen = free || pool[0] || '';
    if (chosen) used.add(chosen);
    picked.set(ev.id, chosen);
  });

}
/* One media element, two possible sources. `cls` is the class the still would
   have had, so the video simply takes its place in the layout. */
function mediaHTML(ev, cls) {
  const src = imageFor(ev);
  const still = src
    ? '<img class="' + cls + '" src="' + esc(src) + '" alt="" onerror="this.remove()">'
    : '';
  if (!ev.video || REDUCED_MOTION) return still;
  return '<video class="' + cls + '" autoplay muted loop playsinline' +

const REDUCED_MOTION = window.matchMedia
  && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

function imageFor(ev) {
  return (state.images && state.images.get(ev.id)) || ev.image || '';
}

/* ── Render ────────────────────────────────────────────────────────────── */
function visibleEvents() {
  const now = Date.now();
  return state.events.filter(e => e.end > now);
}

function featuredEvent(visible) {
  return visible.find(e => e.id === CONFIG.FEATURED_ID)
    || (CONFIG.HERO_SINGLE_ONLY ? visible.find(e => !e.multiDay) : null)
    || visible[0]
    || null;
}

function eventDescription(ev) {
  return ev.description
    || (labelAddsSomething(ev) ? labelKept(ev) : '');
}


/* The lineup row is locked to one title line — a squashed meta line is worse
   than a smaller name — so a long name gets a smaller size instead of an
   ellipsis. "Indian Dance Summer Intensive" is a real event, not an edge
   case, and a board that ends it in "…" has failed the person reading it.
   Still far above the D-018 floor at every step. */
/* One line, always. Measured against the longest real title in the feed
   ("Indian Semi-Classical · Starter Series", 38 chars) at the row's usable
   width once the thumbnail is gone — the step down never truncates. */
function cardTitleSize(title) {
  const n = title.length;
  if (n <= 22) return 54;
  if (n <= 30) return 50;
  if (n <= 38) return 46;
  return 42;
}

/* Price, in the organiser's exact words — never reformatted, never invented
   (D-049). "Free" is the single strongest reason somebody walks in, so it is
   the one value the board styles differently from a number. */
/* "Free · just show up" already states the price; a Free chip beside it is
   the same fact twice. */
function ctaRepeatsPrice(ev) {
  if (!ev.price || !ev.cta) return false;
  return ev.cta.toLowerCase().includes(ev.price.toLowerCase());
}

/* Detail slides set price and instruction as two pieces of signage. When the
   feed says "Free · just show up", remove the repeated price from the CTA so
   the board still states each fact exactly once (D-024). */
function ctaInstruction(ev) {
  if (!ev.cta) return '';
  if (!ev.price) return ev.cta;
  const price = ev.price.toLowerCase();
  const cta = ev.cta.toLowerCase();
  const at = cta.indexOf(price);
  if (at < 0) return ev.cta;
  return (ev.cta.slice(0, at) + ev.cta.slice(at + ev.price.length))
    .replace(/^[\s·:—–-]+|[\s·:—–-]+$/g, '')
    .replace(/\s{2,}/g, ' ');
}

function priceHTML(ev, freeClass, priceClass) {
  if (!ev.price) return '';
  return /^free\b/i.test(ev.price)
    ? '<span class="' + freeClass + '">' + esc(ev.price) + '</span>'
    : '<span class="' + priceClass + '">' + esc(ev.price) + '</span>';
}

function detailTitleSize(title) {
  const n = title.length;
  if (n <= 18) return 88;
  if (n <= 30) return 80;
  if (n <= 44) return 68;
  return 56;
}

function heroTitleSize(title) {
  const n = title.length;
  if (n <= 18) return 76;
  if (n <= 30) return 68;
  if (n <= 42) return 62;
  return 56;
}

function heroHTML(ev, stagger) {
  const now = Date.now();
  const d = new Date(ev.start);
  const live = now >= ev.start && now < ev.end;
  const media = mediaHTML(ev, 'hero-photo');
  const photo = media || '<div class="hero-photo-empty" aria-hidden="true"><span>' +
        esc((ev.initial || ev.title.charAt(0)).toUpperCase()) + '</span></div>';

  const kicker = ev.isPinned ? 'Featured'
    : live ? (ev.multiDay ? 'Now running' : 'Happening now')
    : (isToday(ev.start) && ev.startKnown) ? (d.getHours() >= 17 ? 'Tonight' : 'Today') + ' — featured'
    : isToday(ev.start) ? 'Today — featured'
    : 'Coming up';

  const description = eventDescription(ev);
  /* PROOF · C — host is escaped text; the location bit (locBitHTML) carries
     its own icon + its own esc() call, so it must not be re-escaped here. */
  const metaBits = [ev.host ? esc(ev.host) : '', locBitHTML(ev)].filter(Boolean);

  /* A countdown may only tick towards a real published time; a date-only
     event states the date instead, and never a fabricated 00:00 (D-108). */
  let foot;
  if (live && ev.multiDay) foot = '<div class="progress-note">Runs to <em>' + fmtDayMon(ev.end) + '</em></div>';
  else if (live && ev.endKnown)
    foot = '<div class="progress-track"><div class="progress-fill" style="width:' +
        Math.min(100, ((now - ev.start) / (ev.end - ev.start)) * 100).toFixed(1) + '%"></div></div>' +
      '<div class="progress-note">Ends <em>' + fmtTime(ev.end) + '</em></div>';
  else if (live) foot = '<div class="progress-note">On <em>now</em></div>';
  else if (!ev.startKnown) {
    const midnight = (t) => { const x = new Date(t); x.setHours(0, 0, 0, 0); return x.getTime(); };
    const days = Math.round((midnight(ev.start) - midnight(now)) / 864e5);
    foot = days <= 0 ? '' :
      '<div class="countdown-label">Starts in</div><div class="countdown">' + days +
      (days === 1 ? ' day' : ' days') + '</div>';
  } else {
    foot = '<div class="countdown-label">Starts in</div>' +
      '<div class="countdown js-countdown" data-start="' + ev.start + '">' + fmtHMS(ev.start - now) + '</div>';
  }

  /* PROOF · E — a running per-child index for the first-load-only stagger
     (see stagAttrs() and the frequency-gate comment in #proof above).
     stagger is false on every render after the first, in which case
     stagAttrs() emits exactly the plain class attribute this file always
     had — no visual change, no stray attribute. */
  let i = 0;
  const heroPx = heroTitleSize(ev.title);

  return '<div class="hero-photo-wrap">' + photo +
      chipHTML(ev.start, 'photo-stamp' + (ev.isPinned ? ' photo-stamp--pinned' : '')) + '</div>' +
    '<div class="hero-content">' +
      '<span' + stagAttrs('kicker-box', '', i++, stagger) + '>' + kicker + '</span>' +
      '<h1' + stagAttrs('hero-title', sizeStyle(heroPx), i++, stagger) + '>' + esc(ev.title) + '</h1>' +
      (description ? '<div' + stagAttrs('hero-desc', '', i++, stagger) + '>' + esc(description) + '</div>'
        : metaBits.length ? '<div' + stagAttrs('hero-meta', '', i++, stagger) + '>' + metaBits.join(' · ') + '</div>' : '') +
      /* The chip on the photograph already carries the date (D-024). */
      '<div' + stagAttrs('hero-time', '', i++, stagger) + '>' + timeLineHTML(ev, live && (ev.endKnown || ev.multiDay), true) + '</div>' +
      (ctaRepeatsPrice(ev) ? '' : priceHTML(ev, 'hero-price' + (stagger ? ' stagger' : ''), 'hero-price' + (stagger ? ' stagger' : ''))) +
      '<div' + stagAttrs('hero-foot', '', i++, stagger) + '>' + foot + '</div>' +
    '</div>';
}

function heroEmptyHTML() {
  /* An unreachable feed and an empty calendar are different facts, and the
     board says which. */
  const broken = state.source === 'error';
  return '<div class="hero-photo-wrap"></div>' +
    '<div class="hero-content">' +
      '<h1 class="hero-empty-title">' +
        (broken ? 'Programme unavailable.' : 'See you on the dance floor.') + '</h1>' +
      '<div class="hero-empty-sub">' +
        (broken ? 'The events feed cannot be reached — see shoonyadance.com for what is on.'
                : 'No upcoming events on the board right now.') + '</div>' +
    '</div>';
}

function renderHero(featured) {
  const key = featured ? rowKey(featured) : '∅';
  const current = document.getElementById('hero-' + state.activeLayer);
  /* PROOF · E — state.firstPaint is only ever true on this function's very
     first call this session (render() clears it at the end of the first
     pass); every later cross-fade (a page turn, a featured-event change)
     passes false straight through, so heroHTML() emits plain classes. */
  if (state.featuredId === key) {
    current.innerHTML = featured ? heroHTML(featured, state.firstPaint) : heroEmptyHTML();
    return;
  }
  const nextName = state.activeLayer === 'a' ? 'b' : 'a';
  const next = document.getElementById('hero-' + nextName);
  next.innerHTML = featured ? heroHTML(featured, state.firstPaint) : heroEmptyHTML();
  next.classList.add('is-active');
  current.classList.remove('is-active');
  state.activeLayer = nextName;
  state.featuredId = key;
}

/* Board 2 — one event at a time, with the same information as the overview

function detailHTML(ev, index, total, isHighlight) {
  if (!ev) {
    return '<div class="detail-empty">See you on the dance floor.</div>';
  }
  const media = mediaHTML(ev, 'detail-photo');
  const photo = media || '<div class="detail-photo-empty" aria-hidden="true"><span>' +
        esc((ev.initial || ev.title.charAt(0)).toUpperCase()) + '</span></div>';
  const description = eventDescription(ev);
  /* PROOF · C — host escaped individually; locBitHTML carries its own icon
     + its own esc(), so the old blanket .map(esc) would double-escape it. */
  const place = [ev.host ? esc(ev.host) : '', locBitHTML(ev)].filter(Boolean).join(' · ');

  const instruction = ctaInstruction(ev);
  /* PROOF · C — i-ticket on a registration/booking instruction, never on

  const instructionHTML = instruction
    ? (isBooking(instruction) ? iconHTML('ticket') + esc(instruction) : esc(instruction))
    : '';

  return '<div class="detail-photo-wrap">' + photo + chipHTML(ev.start, 'photo-stamp') + '</div>' +
    '<div class="detail-copy">' +
      /* "Looking ahead" rather than "Coming up": these are the events further
         out, and saying so is true of every one of them without claiming
         anything about tickets or dates. */
      '<div class="detail-index">' + (isHighlight ? 'Looking ahead' : 'Event spotlight') +
        ' · ' + String(index + 1).padStart(2, '0') + '/' + String(total).padStart(2, '0') + '</div>' +
      '<h2 class="detail-title" style="' + sizeStyle(detailTitleSize(ev.title)) + '">' + esc(ev.title) + '</h2>' +
      (description ? '<p class="detail-description">' + esc(description) + '</p>' : '') +
      '<div class="detail-facts">' +
        '<div class="detail-when">' + timeLineHTML(ev, false, true) +
          (place ? '<div class="detail-place">' + place + '</div>' : '') + '</div>' +
        ((detailPrice || instruction) ? '<div class="detail-action">' + detailPrice +
          (instructionHTML ? '<div class="detail-cta">' + instructionHTML + '</div>' : '') + '</div>' : '') +
      '</div>' +
    '</div>';
}


function cardHTML(ev, rowIndex, stagger) {
  /* A clock only when one was published. The meta line reads left to right in
     the order somebody actually decides: when, what it costs, who and where.
     A row with nothing else to say falls back to the feed's date label rather
     than rendering an empty line. */
  const lead = ev.multiDay ? '<b>till ' + fmtDayMon(ev.end) + '</b>'
    : ev.startKnown ? '<b>' + fmtTime(ev.start) + '</b>'
    : '';
  /* The overview row shows no CTA, so it always carries the price itself —
     the de-duplication below is only for the detail board, which shows both.
     Dropping "Free" from a list row would delete the single strongest reason
     anybody walks in. */
  const price = priceHTML(ev, 'free', 'price');
  /* PROOF · C — locBitHTML carries its own icon + its own esc() call. */
  const bits = [lead, price, ev.host ? esc(ev.host) : '', locBitHTML(ev)].filter(Boolean);
  if (!lead && !price && labelAddsSomething(ev)) bits.unshift(esc(labelKept(ev)));
  else if (labelAddsSomething(ev) && bits.length < 3) bits.push(esc(labelKept(ev)));
  const meta = bits.join(' · ');
  return '<article' + stagAttrs('event-card' + (ev.isPinned ? ' event-card--pinned' : ''), '', rowIndex, stagger) + '>' +
    /* Solid vibrant block, white date — the component layer's .date-chip
       (D-101), not a new invention. At 8 m a filled plane finds the eye far
       faster than type on bone, and it gives the row a fixed anchor to scan
       down. */
    chipHTML(ev.start, 'row-chip') +
    '<div class="event-card-body">' +
      '<h3 class="event-card-title" style="font-size:' + cardTitleSize(ev.title) + 'px">' +
        esc(ev.title) + '</h3>' +
      '<div class="event-card-meta">' + meta + '</div>' +
    '</div>' +
  '</article>';
}


function rowKey(ev) {
  return [ev.id, ev.title, ev.start, ev.end, ev.price, imageFor(ev), ev.video,
          ev.startKnown, ev.endKnown, ev.multiDay, ev.isPinned].join('~');
}

function renderGrid(upcoming, pageStart, shownCount, rotationTotal, scheduledTotal, page, pageCount) {
  const key = upcoming.map(rowKey).join('|') + '+' + pageStart + '/' + shownCount +
    '/' + rotationTotal + '/' + scheduledTotal + '/' + page + '/' + pageCount;
  if (key === state.gridKey) return;
  state.gridKey = key;

  const grid = document.getElementById('grid');
  const html = upcoming.length
    /* Say where in the programme this page sits. "+23 more" told a reader the
       board was hiding things; "6 – 10 of 28" tells them it is working through
       them and theirs is coming. */
    /* PROOF · E — state.firstPaint gates .stagger the same way it does in
       heroHTML(); false on every render after the first. */
    ? upcoming.map((ev, idx) => cardHTML(ev, idx, state.firstPaint)).join('') +
      '<div class="grid-more">Showing ' + (pageStart + 1) + ' – ' +
        (pageStart + shownCount) + ' of ' + rotationTotal + ' · ' + scheduledTotal +
        ' scheduled · Page ' + (page + 1) + ' of ' + pageCount + '</div>'
    : '<div class="grid-empty">Nothing else scheduled yet — check back soon.</div>';

  grid.classList.add('is-fading');
  setTimeout(() => {
    grid.innerHTML = html;
    grid.classList.remove('is-fading');
  }, 650);
}

function renderBadge() {
  const badge = document.getElementById('src-badge');
  badge.className = 'src-badge' +
    (state.source === 'demo' ? ' is-demo'
      : (state.source === 'stale' || state.source === 'error') ? ' is-stale' : '');
  badge.textContent = state.source === 'demo' ? 'Demo data'
    : state.source === 'stale' ? 'Offline — last known'
    : state.source === 'error' ? 'Feed unavailable' : '';
}

function renderDetail() {
  const run = state.phase === 'highlights' ? state.highlights : state.rotationEvents;
  const i = state.phase === 'highlights' ? state.highlightIndex : state.storyIndex;
  const ev = run[i] || null;
  const key = ev ? rowKey(ev) + '|' + state.phase + '|' + i + '|' + run.length : '∅';
  if (key === state.detailKey) return;
  state.detailKey = key;
  document.getElementById('board-detail').innerHTML =
    detailHTML(ev, i, run.length, state.phase === 'highlights');
}

function render() {
  const visible = visibleEvents();
  /* The pinned event keeps the top of the list rather than a photo panel of
     its own, and the rest follow in date order. The overview and the rotation
     show the SAME five events, so the board reads as an index of what is
     about to be shown one at a time — not as two competing lists. */
  const featured = featuredEvent(visible);
  const ordered = featured
    ? [featured].concat(visible.filter(e => e !== featured))
    : visible.slice();
  ordered.forEach(e => { e.isPinned = false; });
  if (featured) featured.isPinned = featured.id === CONFIG.FEATURED_ID;

  /* The board PAGES through the programme instead of showing only the first
     five. A studio with 28 things coming up was previously advertising five of
     them and summarising the rest as "+23 more"; the other 23 were the whole
     point of the screen. */
  /* Highlights leave the chronological walk entirely and close the lap
     instead, so each event still appears exactly once per lap — and Sangam or
     Round Trip to Cuba get a screen without having to be imminent. */
  state.highlights = ordered.filter(e => e.highlight);
  const paged = ordered.filter(e => !e.highlight);
  if (state.highlightIndex >= state.highlights.length) state.highlightIndex = 0;
  const walk = CONFIG.ROTATION_LIMIT ? paged.slice(0, CONFIG.ROTATION_LIMIT) : paged;
  state.allEvents = walk;
  state.pageCount = Math.max(1, Math.ceil(walk.length / CONFIG.PAGE_SIZE));
  if (state.page >= state.pageCount) state.page = 0;

  const from = state.page * CONFIG.PAGE_SIZE;
  /* One page = one hero + the rest as rows. The hero leads on this page's
     first event, so it changes as the board works through the programme
     instead of showing the same photograph for seven minutes. */
  const shown = walk.slice(from, from + CONFIG.PAGE_SIZE);
  /* Assign photographs across the page before anything renders, so the overview
     row and that event's detail slide agree on which frame it owns, and no two
     rows on screen together share one. */
  state.images = assignImages(shown);
  state.rotationEvents = shown;
  if (state.storyIndex >= state.rotationEvents.length) state.storyIndex = 0;

  /* The hero event is NOT repeated in the list beside it (D-024). */
  renderHero(shown[0] || null);
  renderGrid(shown.slice(1), from, shown.length, walk.length, ordered.length,
    state.page, state.pageCount);
  renderDetail();
  state.images = assignImages(shown.concat(state.highlights));
  renderTimetable(todaysProgramme());
  renderBadge();
  /* PROOF · E — flips AFTER this pass has used it (renderHero/renderGrid
     above read it while it was still true). Every later call — the 60s
     poll, the 15s expiry sweep, a page turn, a highlight lap — sees false
     and never re-enters the first-load stagger. */
  state.firstPaint = false;
}

/* The event whose programme belongs on screen today — if any. */
function todaysProgramme() {
  return state.events.find(e => e.programme && isToday(e.start)) || null;
}

function timetableHTML(ev) {
  const now = Date.now();
  const blocks = ev.programme.blocks;
  /* "Which one is on now" is the whole reason somebody looks up. A block runs
     from its own time until the next one starts (the last until the event's
     end), so the board can mark it without anyone publishing durations. */
  const startOf = (hm) => {
    const [h, m] = hm.split(':').map(Number);
    const d = new Date(ev.start); d.setHours(h, m, 0, 0); return d.getTime();
  };
  const starts = blocks.map(b => startOf(b.time));
  const beforeProgramme = starts.length && now < starts[0];
  const rows = blocks.map((b, i) => {
    const from = starts[i];
    const to = i + 1 < blocks.length ? starts[i + 1] : ev.end;
    const live = now >= from && now < to;
    const past = now >= to;
    const next = beforeProgramme && i === 0;
    return '<div class="tt-row' + (live ? ' is-now' : past ? ' is-past' : next ? ' is-next' : '') + '">' +
      '<div class="tt-time">' + esc(b.time) + '</div>' +
      '<div class="tt-items">' + b.items.map(esc).join(' · ') +
        (live ? '<span class="tt-now-tag">On now</span>'
          : next ? '<span class="tt-now-tag">Up next</span>' : '') +
      '</div>' +
    '</div>';
  }).join('');

  const when = ev.startKnown
    ? DAYS[new Date(ev.start).getDay()] + ' · ' + fmtTime(ev.start) +
      (ev.endKnown ? ' – ' + fmtTime(ev.end) : '')
    : DAYS[new Date(ev.start).getDay()];

  return '<div class="tt-head">' +
      '<h2 class="tt-title">Today <em>at Shoonya</em></h2>' +
      '<div class="tt-when">' + when + '</div>' +
    '</div>' +
    (ev.programme.note ? '<p class="tt-note">' + esc(ev.programme.note) + '</p>' : '') +
    '<div class="tt-rows">' + rows + '</div>';
}

function renderTimetable(ev) {
  if (!ev) return;
  document.getElementById('board-timetable').innerHTML = timetableHTML(ev);
}

/* ── Boards: overview, five short event stories, overview again ───────── */
function showBoard(name) {
  document.querySelectorAll('.board').forEach(b =>
    b.classList.toggle('is-active', b.id === 'board-' + name));
  state.board = name;
}

function startBoards() {
  const pinned = new URLSearchParams(location.search).get('board');
  const requested = pinned === 'now' ? 'detail' : pinned;
  if (requested && CONFIG.AVAILABLE_BOARDS.includes(requested)) {
    showBoard(requested);
    if (requested === 'detail') renderDetail();
    return;
  }
  showBoard('events');
  scheduleNextBoard(CONFIG.OVERVIEW_MS);
}

function scheduleNextBoard(delay) {
  clearTimeout(state.boardTimer);
  state.boardTimer = setTimeout(advanceBoard, delay);
}

function advanceBoard() {
  if (!state.rotationEvents.length) {
    showBoard('events');
    scheduleNextBoard(CONFIG.OVERVIEW_MS);
    return;
  }
  if (state.board === 'events') {
    /* On the day of a programmed event the timetable follows EVERY overview,
       so it comes round roughly once a minute — often enough that somebody
       walking past the screen catches it without waiting for a full cycle. */
    if (todaysProgramme()) {
      renderTimetable(todaysProgramme());
      showBoard('timetable');
      scheduleNextBoard(CONFIG.TIMETABLE_MS);
      return;
    }
    state.storyIndex = 0;
    state.detailKey = '';
    renderDetail();
    showBoard('detail');
    scheduleNextBoard(CONFIG.DETAIL_MS);
    return;
  }
  if (state.board === 'timetable') {
    state.storyIndex = 0;
    state.detailKey = '';
    renderDetail();
    showBoard('detail');
    scheduleNextBoard(CONFIG.DETAIL_MS);
    return;
  }
  /* Inside the closing run of highlights. */
  if (state.phase === 'highlights') {
    if (state.highlightIndex < state.highlights.length - 1) {
      state.highlightIndex += 1;
      state.detailKey = '';
      renderDetail();
      scheduleNextBoard(CONFIG.HIGHLIGHT_MS);
      return;
    }
    /* Lap complete — back to the top of the programme. */
    state.phase = 'pages';
    state.highlightIndex = 0;
    state.page = 0;
    state.storyIndex = 0;
    state.gridKey = '';
    state.detailKey = '';
    render();
    showBoard('events');
    scheduleNextBoard(CONFIG.OVERVIEW_MS);
    return;
  }

  if (state.storyIndex < state.rotationEvents.length - 1) {
    state.storyIndex += 1;
    state.detailKey = '';
    renderDetail();
    scheduleNextBoard(CONFIG.DETAIL_MS);
    return;
  }

  /* End of this page's slides. On the last page the highlights close the lap;
     otherwise turn the page and show its overview. */
  const lastPage = state.page === state.pageCount - 1;
  if (lastPage && state.highlights.length) {
    state.phase = 'highlights';
    state.highlightIndex = 0;
    state.detailKey = '';
    renderDetail();
    showBoard('detail');
    scheduleNextBoard(CONFIG.HIGHLIGHT_MS);
    return;
  }
  state.storyIndex = 0;
  state.page = (state.page + 1) % state.pageCount;
  state.gridKey = '';
  render();
  showBoard('events');
  scheduleNextBoard(CONFIG.OVERVIEW_MS);
}

/* ── Clock + live countdown ────────────────────────────────────────────── */
function tickClock() {
  const now = new Date();
  document.getElementById('clock-time').textContent = fmtTime(now.getTime());
  document.getElementById('clock-date').textContent =
    DAYS[now.getDay()].slice(0, 3) + ' ' + now.getDate() + ' ' + MONTHS[now.getMonth()];
  document.querySelectorAll('.js-countdown').forEach(el => {
    el.textContent = fmtHMS(Number(el.dataset.start) - now.getTime());
  });
}

/* ── Stage scaling — fit the 1920×1080 canvas to any output ───────────── */
function fitStage() {
  const vv = window.visualViewport;
  const w = Math.max(
    vv && vv.width ? vv.width : 0,
    document.documentElement.clientWidth || 0,
    window.innerWidth || 0
  );
  const h = Math.max(
    vv && vv.height ? vv.height : 0,
    document.documentElement.clientHeight || 0,
    window.innerHeight || 0
  );
  if (!w || !h) {
    window.setTimeout(fitStage, 250);
    return;
  }
  const s = Math.min(w / 1920, h / 1080) * CONFIG.SAFE_SCALE;
  document.getElementById('stage').style.transform =
    'translate(-50%, -50%) scale(' + s + ')';
}

/* ── Boot ──────────────────────────────────────────────────────────────── */
window.addEventListener('resize', fitStage);
window.addEventListener('load', fitStage);
if (window.visualViewport) window.visualViewport.addEventListener('resize', fitStage);
fitStage();
setTimeout(fitStage, 250);
setTimeout(fitStage, 1000);
setTimeout(fitStage, 3000);
tickClock();
setInterval(tickClock, 1000);
fetchEvents();
startBoards();
setInterval(fetchEvents, CONFIG.POLL_MS);
setInterval(render, CONFIG.SWEEP_MS);   // local expiry sweep between polls

/* QA hooks (harmless in production) */
window.__tv = {
  state,
  showBoard,
  advanceBoard,
  expireFirst() {   // force the featured event to expire → watch the shift
    const v = visibleEvents();
    if (v[0]) { v[0].end = Date.now() - 1; render(); }
  },
  /* __tv.load(payload) — push a feed payload straight in, the way a fetch
     would. Lets a real events.json be checked against this board before it
     is deployed anywhere, without editing CONFIG.API_URL and risking a
     debug URL shipping to the wall. */
  /* __tv.advance() — step the rotation one screen without waiting on the
     timers, so a whole lap can be walked and checked in a second. */
  advance() { clearTimeout(state.boardTimer); advanceBoard(); return __tv.where(); },
  where() {
    const run = state.phase === 'highlights' ? state.highlights : state.rotationEvents;
    const i = state.phase === 'highlights' ? state.highlightIndex : state.storyIndex;
    if (state.board === 'events') return 'OVERVIEW page ' + (state.page + 1);
    if (state.board === 'timetable') return 'TIMETABLE';
    return (state.phase === 'highlights' ? 'HIGHLIGHT · ' : 'slide · ') + ((run[i] || {}).title || '?');
  },
  load(payload) {
    state.events = normalize(payload);
    state.source = 'live';
    render();
    return state.events.length;
  }
};
</script>
