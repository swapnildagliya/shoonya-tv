<style>/* inlined from ../../../colors_and_type.css — do not edit here, edit the source */
/* =====================================================================
   Shoonya Design System — Foundations
   Colors, type, spacing, marks. Drop this CSS in any artifact and
   import the same fonts. Two foundations (black / bone #F4F1EB; pure
   white is for cards/elevated only — D-071). One vibrant per design.
   Never both vibrants in the same frame.
   ===================================================================== */

/* --- Web fonts -------------------------------------------------------- */
/* Playfair Display — local TTFs, weights 400/500/600 + italics in use.
   Black / Bold / ExtraBold are loaded for completeness but the system
   restricts headlines to Medium 500 (per the spec). */

/* Inter — local TTFs, graphics/system weights 400 and 500 only. */

:root {
  /* ------- Foundations (the two grounds) ------------------------------ */
  --void-black: #000000;       /* Foundation A — depth, ceremony, focus   */
  --bone:       #F4F1EB;       /* Foundation B — warm light ground / default (D-071) */
  --void-white: #FFFFFF;       /* Cards / elevated layers on bone only (D-071)        */

  /* ------- Neutrals --------------------------------------------------- */
  --mist:     #D6D6D6;         /* Dividers, secondary surfaces            */
  --charcoal: #4A4A4A;         /* Body on white when pure black too heavy */

  /* ------- The vibrant palette (one per design only) ------------------ */
  --vibrant-purple: #B564F7;   /* Shoonya Dance Centre                    */
  --vibrant-pink:   #EEAACF;   /* social / GIDF opening-party tint        */
  --vibrant-saffron:#E85D1F;   /* @swapkebolly — personal voice   */
  --vibrant-yellow: #FBC70F;   /* ABC a Bollywood Company                 */
  --vibrant-teal:       #6FB7B1; /* Ghent Tap Festival (D-008)            */
  --vibrant-pomegranate:#C13B5A; /* Leylet Raqs (D-009, ratified)         */
  --vibrant-coral:      #F25A4C; /* Social Nights — single signature (D-040) */
  --abc-tint:           #FFCF5A; /* ABC soft web tint — NOT a vibrant (D-005) */

  /* ------- @swapkebolly act palette (D-096) --------------------------- */
  /* No single vibrant — one colour per act, from the live site. oklch    */
  /* verbatim, never converted to hex (D-081). Bold orange is excluded.   */
  --sw-cobalt:   oklch(0.50 0.21 264);  /* Live dates · Hello · default   */
  --sw-marigold: oklch(0.85 0.16 84);   /* Workshops — carries ink text   */
  --sw-pink:     oklch(0.60 0.19 350);  /* Invitation                     */
  --sw-indigo:   oklch(0.20 0.06 295);  /* Body                           */
  --sw-cream:    oklch(0.955 0.02 85);  /* Classes                        */
  --sw-blush:    oklch(0.93 0.035 25);  /* Table                          */

  /* ------- Operational schedule/form exception (D-070) --------------- */
  --operational-paper: #F0EDE8;  /* App/form/schedule shell only — not a brand foundation */
  --cat-partner:   var(--void-black);       /* Partner & Social category dot */
  --cat-technique: #E85D1F;                 /* Classical & Technique category dot — own literal, NOT the brand token (D-070/D-096) */
  --cat-culture:   var(--vibrant-purple);   /* Culture & Wellness category dot */

  /* ------- Brand → vibrant aliases (use these in product code) -------- */
  --brand-shoonya:  var(--vibrant-purple);
  --brand-abc:      var(--vibrant-yellow);
  --brand-gidf:     var(--vibrant-purple); /* hub default = Shoonya host purple (ND-003 resolved 2026-06-04); programme-coded per event type — pink/saffron/yellow/purple (D-006) */
  --brand-swapnil:  var(--sw-cobalt); /* act-coded (D-096) — cobalt is the default; override per act */
  --brand-cook:     var(--vibrant-pink); /* @cookwithswapke — pink (tokens.json v2.1) */
  --brand-ghent-tap:   var(--vibrant-teal);        /* Ghent Tap Festival (D-008)   */
  --brand-leylet-raqs: var(--vibrant-pomegranate); /* Leylet Raqs (D-009)          */

  /* ------- Semantic foreground / background --------------------------- */
  /* Default: bone foundation (D-071) — pure white is for cards/elevated  */
  --bg:        var(--bone);
  --fg:        var(--void-black);
  --fg-1:      var(--void-black);   /* primary ink                        */
  --fg-2:      var(--charcoal);     /* body text                          */
  --fg-3:      #8A8A8A;             /* tertiary, captions on white        */
  --rule:      var(--mist);          /* hairline rules / dividers          */
  --vibrant:   var(--vibrant-purple); /* default to Shoonya studio         */

  /* ------- Type families --------------------------------------------- */
  --font-display: "Playfair Display", "Cormorant Garamond", Georgia, serif;
  --font-body:    "Inter", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
  --font-numeric: "Inter", "SF Mono", ui-monospace, monospace;

  /* ------- Type scale (digital — posters scale up separately) -------- */
  --type-hero:    clamp(56px, 8vw, 96px); /* Playfair Display Medium      */
  --type-h1:      clamp(40px, 5vw, 64px);
  --type-h2:      clamp(30px, 3.4vw, 48px);
  --type-h3:      clamp(24px, 2.4vw, 32px);
  --type-sub:     clamp(22px, 2vw, 30px); /* Playfair italic                */
  --type-body:    17px;                   /* Inter Regular                  */
  --type-body-sm: 15px;
  --type-caption: 12px;                   /* Inter Medium ALL CAPS          */
  --type-eyebrow: 11px;

  --leading-tight: 1.08;
  --leading-snug:  1.2;
  --leading-body:  1.6;

  --tracking-caption: 0.12em;
  --tracking-eyebrow: 0.18em;

  /* ------- 8-point spacing ------------------------------------------ */
  --space-1: 8px;
  --space-2: 16px;
  --space-3: 24px;
  --space-4: 32px;
  --space-5: 48px;

  border: var(--line) solid var(--fg-3);
  color: var(--fg-2);
}
.src-badge.is-demo  { display: inline-block; border-color: var(--vibrant); color: var(--vibrant); }
.src-badge.is-stale { display: inline-block; }

.lineup-header {
  font-family: var(--font-display);
  font-weight: 500;
  font-size: 68px;
  line-height: 1;
  letter-spacing: -0.01em;
  color: var(--fg-1);
  margin: 4px 0 0;
  padding-bottom: 18px;
  border-bottom: 3px solid var(--fg-1);
}
.lineup-header em { font-style: italic; color: var(--vibrant); }

.grid {
  flex: 1;
  min-height: 0;
  display: flex;
  flex-direction: column;
  /* 30, not 36: three rows of two-line titles need the 18px back — the
     rhythm survives it, a clipped third row would not. */
  gap: 12px;
  padding-top: 20px;
  transition: opacity 450ms var(--ease);
}
.grid.is-fading { opacity: 0; }

/* Cards share the column evenly. Alternating rhythm + type-set date come
   from the component layer (.event-card--flip · .date-type). */
.grid .event-card {
  flex: 1 1 0;
  min-height: 0;
  opacity: 0;
  transform: translateY(10px);
  animation: cardIn 700ms var(--ease) forwards;
}
/* Widths tuned so a real event name ("Salsa & Bachata Social") fits on one
   line — the title is the most important thing on the row, so the thumb and
   date give up space to it, never the reverse. */
/* 14px, not 18: a two-line title needs the vertical room more than the row
   needs the breathing space, and three rows still have to clear 1080. */
.grid .event-card-body { padding: 10px 24px; }
.grid .event-card-thumb { width: 150px; }
.grid .date-type { min-width: 124px; padding-left: 18px; padding-right: 18px; }
.grid .date-type .day { font-size: 54px; }
.grid .date-type .month { font-size: 20px; }
/* Two lines, not one. Real event names ("Indian Dance Summer Intensive",
   "Milonga Shoonya · Argentine Tango") do not fit a single line at a size
   anyone can read from 5 m, and an ellipsis on a wall screen loses the very
   word that says what the evening is. The meta line below keeps its own
   fixed height, so the title can never squash it. */
.grid .event-card-title {
  flex: 0 0 auto;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.grid .event-card-meta { flex: 0 0 auto; }
@keyframes cardIn { to { opacity: 1; transform: translateY(0); } }

.grid-more {
  flex: 0 0 auto;
  padding-top: 2px;
  font-family: var(--font-body);
  font-weight: 400;
  font-size: 23px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--fg-3);
}

.grid-empty {
  flex: 1;
  display: flex;
  align-items: center;
  font-family: var(--font-body);
  font-weight: 400;
  font-size: 30px;
  color: var(--fg-2);
}

/* ══ BASE BAND — venue + site, exactly once (D-049 · D-024) ═══════════ */
/* Height + the 6px bottom inset keep the band's own text inside the
   title-safe line (y ≤ 1026) while the plane itself bleeds to the edge. */
#stage .base-band {
  flex-shrink: 0;
  height: 120px;
  padding: 0 96px 6px;
}

/* ══ BOARDS — several views on one URL ════════════════════════════════ */
/* `?board=events` or `?board=detail` pins one view. The default sequence
   returns to the overview after walking through the five visible events. */
.boards { position: relative; flex: 1; min-height: 0; }
.board {
  position: absolute;
  inset: 0;
  display: flex;
  opacity: 0;
  visibility: hidden;
  transition: opacity 900ms var(--ease);
}
.board.is-active { opacity: 1; visibility: visible; }

/* ── Board 2 · event story — photograph beside an editorial text field ─ */
.board--detail { background: var(--bone); }
.detail-photo-wrap {
  position: relative;
  width: 54%;
  overflow: hidden;
  background: #E8E8E8;
}
.detail-photo {
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: center 28%;
  display: block;
}
.detail-photo-empty { position: absolute; inset: 0; display: grid; place-items: center; }
.detail-photo-empty span {
  font-family: var(--font-display);
  font-size: 360px;
  color: color-mix(in srgb, var(--vibrant) 28%, transparent);
}
.detail-copy {
  position: relative;
  flex: 1;
  min-width: 0;
  padding: 70px 88px 56px 72px;
  display: flex;
  flex-direction: column;
}
.detail-index {
  font-family: var(--font-body);
  font-size: 22px;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--fg-3);
}
.detail-rule { width: 72px; height: 7px; margin: 28px 0 34px; background: var(--vibrant); }
.detail-title {
  margin: 0 0 28px;
  font-family: var(--font-display);
  font-weight: 500;
  font-size: 78px;
  line-height: 1.02;
  color: var(--fg-1);
}
.detail-description {
  margin: 0 0 30px;
  font-family: var(--font-body);
  font-size: 30px;
  line-height: 1.42;
  color: var(--fg-2);
}
.detail-when {
  margin-top: auto;
  padding-top: 30px;
  border-top: 2px solid var(--fg-1);
  font-family: var(--font-body);
  font-size: 29px;
  line-height: 1.5;
  text-transform: uppercase;
  letter-spacing: 0.04em;
}
.detail-when b { color: var(--vibrant); font-weight: 500; }
.detail-place { color: var(--fg-2); text-transform: none; letter-spacing: 0; }
.detail-cta {
  align-self: flex-start;
  margin-top: 22px;
  padding: 12px 18px;
  background: var(--vibrant);
  color: #FFFFFF;
  font-family: var(--font-body);
  font-size: 22px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
}
.detail-progress { display: flex; gap: 10px; margin-top: 26px; }
.detail-progress span { width: 42px; height: 3px; background: var(--mist); }
.detail-progress span.is-current { background: var(--vibrant); }
.detail-empty { margin: auto; font-family: var(--font-display); font-size: 72px; }

@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; animation: none !important; }
  .grid .event-card { opacity: 1; transform: none; }
}
</style>
</head>
<body>

<div id="stage">

  <div class="boards">

  <!-- ═══ BOARD 1 · Upcoming events — archetype 1, split field ═══ -->
  <section class="board board--events is-active" id="board-events">

    <!-- LEFT · featured event — two layers for the cross-fade -->
    <section class="hero" aria-label="Next event">
      <div class="hero-layer is-active" id="hero-a"></div>
      <div class="hero-layer" id="hero-b"></div>
    </section>

    <!-- RIGHT · upcoming lineup -->
    <section class="lineup" aria-label="Upcoming events">
      <div class="lineup-topbar">
        <span class="src-badge" id="src-badge"></span>
        <span id="clock-date"></span>
        <span id="clock-time"></span>
      </div>

      <h2 class="lineup-header">Upcoming <em>Events</em></h2>

      <div class="grid" id="grid"></div>
    </section>

  </section>

  <!-- ═══ BOARD 2 · one event at a time ═══ -->
  <section class="board board--detail" id="board-detail" aria-label="Event details"></section>

  </div>

  <footer class="base-band">
    <span><b>Shoonya Dance Centre</b> · Stapelplein 41, Gent</span>
    <b>shoonyadance.com</b>
  </footer>

</div>

<script>
'use strict';

/* ════════════════════════════════════════════════════════════════════════
   CONFIG — the only block you should need to touch.
   The feed is the link-in-bio's own events list, republished as JSON beside
   it by projects/shoonya/social-media/links-in-bio/build-events-feed.mjs.
   One list, one deploy, no second source to keep in step.
   Payload: an array (or {events:[...]}) of objects:
     { id, title, host, location, image, url, start_time, end_time,
       start_known, end_known, multi_day, date_label, description, price, cta }
   start_time / end_time = ISO 8601. See events.sample.json.
   ═══════════════════════════════════════════════════════════════════════ */
const CONFIG = {
  API_URL: 'https://links.shoonyadance.com/events.json',
  POLL_MS: 60 * 1000,        // re-fetch cadence
  SWEEP_MS: 15 * 1000,       // local expiry sweep between fetches
  MAX_CARDS: 5,              // overview capacity — five readable rows at 3–5m
  /* Demo data is a DEVELOPMENT aid only. build.mjs forces this to false for
     the deployed board: once a real endpoint exists, a screen in a public
     studio must never show invented event names — someone will read them and
     believe them. Production shows an honest "feed unavailable" instead. */
  DEMO_FALLBACK: false,   // forced off by build.mjs

  FEATURED_ID: 'opendeurdag-sep',
  FEATURED_COPY: {
    'opendeurdag-sep': 'Try 20+ dance styles in one day. Meet the teachers and find your class for the new season.'
  },
  AVAILABLE_BOARDS: ['events', 'detail'],
  OVERVIEW_MS: 20 * 1000,
  DETAIL_MS: 10 * 1000,
  SAFE_SCALE: 0.92,

  /* A ten-week course would otherwise hold the featured slot for ten weeks —
     it is "happening now" every day of its run — and push tonight's social
     into the list. The hero is for what happens in this building soon, so
     multi-day runs stay in the lineup. Set false to let them lead again. */
  HERO_SINGLE_ONLY: true
};

/* ── State ─────────────────────────────────────────────────────────────── */
const state = {
  events: [],          // normalized, sorted by start
  source: 'none',      // 'live' | 'stale' | 'demo' | 'none'
  featuredId: null,
  gridKey: '',
  detailKey: '',
  rotationEvents: [],
  storyIndex: 0,
  boardTimer: null,
  board: null,
  activeLayer: 'a'
};

/* ── Data engine ───────────────────────────────────────────────────────── */
function normalize(payload) {
  const raw = Array.isArray(payload) ? payload : (payload && payload.events) || [];
  return raw
    .map(e => {
      const start = Date.parse(e.start_time || e.start || '');
      const end = Date.parse(e.end_time || e.end || '');
      if (!e.title || isNaN(start) || isNaN(end)) return null;
      return {
        id: String(e.id != null ? e.id : e.title + '|' + start),
        title: String(e.title),
        // The board line — one sentence from the event's live page, carried
        // in the feed as `description` / `board_line` (/event-launch Step 1).
        description: String(e.description || e.board_line || '').trim(),
        /* Price and CTA in the organiser's exact wording. A caption-less TV
           surface has to carry the practical detail itself (D-023 · D-049),
           so the single-event board renders these when the feed supplies
           them — and omits them silently when it does not. Never invented,
           never reformatted. */
        price: String(e.price || '').trim(),
        cta: String(e.cta || '').trim(),
        host: e.host ? String(e.host) : '',
        location: e.location ? String(e.location) : '',
        image: e.image || e.image_url || '',
        /* What the feed knows about the clock. An event published as a date
           with no time arrives with these false, and every renderer below
           then shows the date alone — a wall screen must not state a time
           nobody wrote down. Feeds that omit the flags keep the old
           behaviour: a stated start and end, both trusted. */
        startKnown: e.start_known !== false,
        endKnown: e.end_known !== false,
        multiDay: e.multi_day === true,
        dateLabel: String(e.date_label || '').trim(),
        start, end
      };
    })
    .filter(Boolean)
    .sort((a, b) => a.start - b.start);
}

async function fetchEvents() {
  try {
    const res = await fetch(CONFIG.API_URL, { cache: 'no-store' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    state.events = normalize(await res.json());
    state.source = 'live';
  } catch (err) {
    if (state.source === 'live' || state.source === 'stale') {
      state.source = 'stale';           // keep last good data on screen
    } else if (CONFIG.DEMO_FALLBACK) {
      state.events = demoEvents();
      state.source = 'demo';
    } else {
      state.events = [];                // say so honestly; never invent
      state.source = 'error';
    }
  }
  render();
}

/* Demo data — clearly badged on screen; times are relative so it always
   demonstrates the full lifecycle (first event expires ~2 min after load). */
function demoEvents() {
  const now = Date.now();
  const H = 3600e3, D = 24 * H;
  const mk = (title, description, startOffset, durH, initial) => ({
    id: 'demo-' + title,
    title, description,
    price: 'Demo price · €0',
    cta: 'Demo CTA',
    host: 'Demo data',
    location: 'Stapelplein 41, Gent',
    image: '',
    startKnown: true, endKnown: true, multiDay: false, dateLabel: '',
    start: now + startOffset,
    end: now + startOffset + durH * H,
    initial
  });
  return [
    mk('Salsa & Bachata Social', 'Demo board line — one sentence pulled from the event page.', -2 * H + 2 * 60e3, 2, 'S'),
    mk('Bollywood Beginners', 'Demo board line — one sentence pulled from the event page.', 3 * H, 1.5, 'B'),
    mk('Kathak Intensive', 'Demo board line — one sentence pulled from the event page.', 1 * D + 2 * H, 2, 'K'),
    mk('Lindy Hop Taster', 'Demo board line — one sentence pulled from the event page.', 2 * D + 4 * H, 1.5, 'L'),
    mk('Flamenco Workshop', 'Demo board line — one sentence pulled from the event page.', 4 * D, 2, 'F'),
    mk('Kizomba Night', 'Demo board line — one sentence pulled from the event page.', 5 * D + 3 * H, 3, 'K'),
    mk('Contemporary Lab', 'Demo board line — one sentence pulled from the event page.', 6 * D, 2, 'C'),
    mk('Tap Jam Session', 'Demo board line — one sentence pulled from the event page.', 8 * D, 2, 'T')
  ].sort((a, b) => a.start - b.start);
}

/* ── Formatting ────────────────────────────────────────────────────────── */
const MONTHS = ['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
const DAYS = ['SUNDAY','MONDAY','TUESDAY','WEDNESDAY','THURSDAY','FRIDAY','SATURDAY'];

function fmtTime(ts) {
  const d = new Date(ts);
  return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
}
function fmtHMS(ms) {
  if (ms >= 24 * 3600e3) {
    const days = Math.round(ms / (24 * 3600e3));
    return days + (days === 1 ? ' day' : ' days');
  }
  const s = Math.max(0, Math.floor(ms / 1000));
  const pad = n => String(n).padStart(2, '0');
  return pad(Math.floor(s / 3600)) + ':' + pad(Math.floor(s / 60) % 60) + ':' + pad(s % 60);
}
function isToday(ts) {
  const a = new Date(ts), b = new Date();
  return a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate();
}
function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  })[c]);
}
/* The base band already carries the home venue — repeating it per event
   breaks the each-fact-once rule (D-024). Show a location only if it differs. */
function locForDisplay(ev) {
  return /stapelplein/i.test(ev.location) ? '' : ev.location;
}
function heroTitleSize(title) {
  const n = title.length;
  if (n <= 14) return 120;
  if (n <= 24) return 96;    // 96 ÷ 24px board line = exactly the 4× floor
  if (n <= 40) return 76;
  return 60;
}
/* Solid vibrant chip — stamped on the hero photo */
function chipHTML(ts, extraClass) {
  const d = new Date(ts);
  return '<span class="date-chip' + (extraClass ? ' ' + extraClass : '') + '">' +
    '<span class="day">' + d.getDate() + '</span>' +
    '<span class="month">' + MONTHS[d.getMonth()] + '</span>' +
  '</span>';
}
/* "7 NOV" — the unit a range is built from. */
function fmtDayMon(ts) {
  const d = new Date(ts);
  return d.getDate() + ' ' + MONTHS[d.getMonth()];
}
/* The one place that decides what a board may say about an event's timing.
   Three honest shapes, and no fourth: a range for something that runs over
   days, a weekday + date when only the date was published, a clock only when
   a clock was actually published. */
function timeLineHTML(ev, hideEnd) {
  /* Once a run is under way the footer states where it ends, so the line
     above drops the end and reads as its other half (D-024). */
  if (ev.multiDay)
    return hideEnd ? '<b>From ' + fmtDayMon(ev.start) + '</b>'
      : '<b>' + fmtDayMon(ev.start) + ' – ' + fmtDayMon(ev.end) + '</b>';
  const d = new Date(ev.start);
  if (!ev.startKnown) return DAYS[d.getDay()] + ' · <b>' + fmtDayMon(ev.start) + '</b>';
  return DAYS[d.getDay()] + ' · <b>' + fmtTime(ev.start) +
    (ev.endKnown && !hideEnd ? ' – ' + fmtTime(ev.end) : '') + '</b>';
}
/* A feed's date label is written for a link list, so it often restates the
   very date and time the board has just set in type ("Sat 29 August · 19:20").
   Reprinting it under the title is the classic each-fact-twice slip (D-024).
   Keep the label only when it says something the time line does not — a
   course's weekly slot, a DJ line-up, who is teaching. */
function labelAddsSomething(ev) {
  if (!ev.dateLabel) return false;
  const d = new Date(ev.start), l = ev.dateLabel.toLowerCase();
  const shown = [];
  if (ev.startKnown) shown.push(fmtTime(ev.start));
  if (ev.endKnown) shown.push(fmtTime(ev.end));
  const mon = MONTHS[d.getMonth()].toLowerCase();
  shown.push(d.getDate() + ' ' + mon, mon + ' ' + d.getDate());
  return !shown.some(t => l.includes(t));
}

/* Bottom-left of the hero / the Now board's footer. A countdown may only tick
   towards a real published time; everything else states the date instead. */
function footHTML(ev, now) {
  const live = now >= ev.start && now < ev.end;
  if (live && ev.multiDay)
    return '<div class="progress-note">Runs to <em>' + fmtDayMon(ev.end) + '</em></div>';
  if (live && ev.endKnown)
    return '<div class="progress-track"><div class="progress-fill" style="width:' +
        Math.min(100, ((now - ev.start) / (ev.end - ev.start)) * 100).toFixed(1) + '%"></div></div>' +
      '<div class="progress-note">Ends <em>' + fmtTime(ev.end) + '</em></div>';
  if (live) return '<div class="progress-note">On <em>now</em></div>';
  if (!ev.startKnown) {
    /* No published time means no ticking clock. A whole-day count is still
       true and still useful; the date itself is already set in type above,
       so repeating it here would be the same fact twice (D-024). On the day
       itself the kicker has said everything there is to say. */
    const midnight = (t) => { const x = new Date(t); x.setHours(0, 0, 0, 0); return x.getTime(); };
    const days = Math.round((midnight(ev.start) - midnight(now)) / 864e5);
    if (days <= 0) return '';
    return '<div class="countdown-label">Starts in</div>' +
      '<div class="countdown">' + days + (days === 1 ? ' day' : ' days') + '</div>';
  }
  return '<div class="countdown-label">Starts in</div>' +
    '<div class="countdown js-countdown" data-start="' + ev.start + '">' + fmtHMS(ev.start - now) + '</div>';
}

/* Type-set date — the lineup rows. No year: on a board showing the next
   fortnight it repeats on every row and says nothing (D-024). */
function dateTypeHTML(ts) {
  const d = new Date(ts);
  return '<span class="date-type">' +
    '<span class="day">' + d.getDate() + '</span>' +
    '<span class="month">' + MONTHS[d.getMonth()] + '</span>' +
  '</span>';
}

/* ── Render ────────────────────────────────────────────────────────────── */
function visibleEvents() {
  const now = Date.now();
  return state.events.filter(e => e.end > now);
}

function featuredEvent(visible) {
  return visible.find(e => e.id === CONFIG.FEATURED_ID)
    || (CONFIG.HERO_SINGLE_ONLY ? visible.find(e => !e.multiDay) : null)
    || visible[0]
    || null;
}

function eventDescription(ev) {
  return CONFIG.FEATURED_COPY[ev.id]
    || ev.description
    || (labelAddsSomething(ev) ? ev.dateLabel : '');
}

function heroHTML(ev) {
  const d = new Date(ev.start);
  const now = Date.now();
  const live = now >= ev.start && now < ev.end;

  const foot = footHTML(ev, now);

  const photo = ev.image
    ? '<img class="hero-photo" src="' + esc(ev.image) + '" alt="" onerror="this.remove()">'
    /* Decorative stand-in for a missing photo — hidden from assistive tech,
       and excluded from the D-098 type measurement for the same reason. */
    : '<div class="hero-photo-empty" aria-hidden="true"><span>' +
        esc((ev.initial || ev.title.charAt(0)).toUpperCase()) + '</span></div>';

  /* "Happening now" claims something is on the floor this minute — true of a
     social, not of a ten-week course that merely started. */
  const kicker = live ? (ev.multiDay ? 'Now running' : 'Happening now')
    : (isToday(ev.start) && ev.startKnown) ? (d.getHours() >= 17 ? 'Tonight' : 'Today') + ' — featured'
    : isToday(ev.start) ? 'Today — featured'
    : 'Up next';

  const metaBits = [ev.host, locForDisplay(ev)].filter(Boolean).map(esc);

  /* The board line is the more useful context, so it takes the slot when
     present; without one the host/location line keeps the space honest. */
  /* The board line first; then the feed's own date label, which is where a
     course carries what it cannot say in a clock ("Wednesdays 19:30");
     then host/location. Never two of them — one line, one job (D-024). */
  const description = eventDescription(ev);
  const context = description
    ? '<div class="hero-desc">' + esc(description) + '</div>'
    : labelAddsSomething(ev)
      ? '<div class="hero-meta">' + esc(ev.dateLabel) + '</div>'
      : (metaBits.length ? '<div class="hero-meta">' + metaBits.join(' · ') + '</div>' : '');

  return '<div class="hero-photo-wrap">' + photo + chipHTML(ev.start, 'photo-stamp') + '</div>' +
    '<div class="hero-content">' +
      '<span class="kicker-box">' + kicker + '</span>' +
      '<h1 class="hero-title" style="font-size:' + heroTitleSize(ev.title) + 'px">' + esc(ev.title) + '</h1>' +
      context +
      '<div class="hero-time">' + timeLineHTML(ev, live && (ev.endKnown || ev.multiDay)) + '</div>' +
      '<div class="hero-foot">' + foot + '</div>' +
    '</div>';
}

/* The lineup row is locked to one title line — a squashed meta line is worse
   than a smaller name — so a long name gets a smaller size instead of an
   ellipsis. "Indian Dance Summer Intensive" is a real event, not an edge
   case, and a board that ends it in "…" has failed the person reading it.
   Still far above the D-018 floor at every step. */
function cardTitleSize(title) {
  const n = title.length;
  if (n <= 22) return 36;
  if (n <= 34) return 32;
  return 28;
}

function detailTitleSize(title) {
  const n = title.length;
  if (n <= 18) return 92;
  if (n <= 30) return 78;
  if (n <= 44) return 66;
  return 56;
}

/* Board 2 — one event at a time, with the same information as the overview
   given enough space to be understood from across the studio. */
function detailHTML(ev, index, total) {
  if (!ev) {
    return '<div class="detail-empty">See you on the dance floor.</div>';
  }
  const photo = ev.image
    ? '<img class="detail-photo" src="' + esc(ev.image) + '" alt="" onerror="this.remove()">'
    : '<div class="detail-photo-empty" aria-hidden="true"><span>' +
        esc((ev.initial || ev.title.charAt(0)).toUpperCase()) + '</span></div>';
  const description = eventDescription(ev);
  const place = [ev.host, locForDisplay(ev)].filter(Boolean).map(esc).join(' · ');
  const progress = Array.from({ length: total }, (_, i) =>
    '<span' + (i === index ? ' class="is-current"' : '') + '></span>').join('');

  return '<div class="detail-photo-wrap">' + photo + chipHTML(ev.start, 'photo-stamp') + '</div>' +
    '<div class="detail-copy">' +
      '<div class="detail-index">Coming up · ' + (index + 1) + ' of ' + total + '</div>' +
      '<div class="detail-rule"></div>' +
      '<h2 class="detail-title" style="font-size:' + detailTitleSize(ev.title) + 'px">' + esc(ev.title) + '</h2>' +
      (description ? '<p class="detail-description">' + esc(description) + '</p>' : '') +
      '<div class="detail-when">' + timeLineHTML(ev) +
        (place ? '<div class="detail-place">' + place + '</div>' : '') + '</div>' +
      (ev.price || ev.cta ? '<div class="detail-cta">' + esc([ev.price, ev.cta].filter(Boolean).join(' · ')) + '</div>' : '') +
      '<div class="detail-progress">' + progress + '</div>' +
    '</div>';
}

function heroEmptyHTML() {
  /* An unreachable feed and a genuinely empty calendar are different facts,
     and the board says which. Claiming "no events" when we simply cannot
     reach the feed would be the screen telling a lie. */
  const broken = state.source === 'error';
  return '<div class="hero-photo-wrap"></div>' +
    '<div class="hero-content">' +
      '<h1 class="hero-empty-title">' +
        (broken ? 'Programme unavailable.' : 'See you on the dance floor.') +
      '</h1>' +
      '<div class="hero-empty-sub">' +
        (broken
          ? 'The events feed cannot be reached — see shoonyadance.com for what is on.'
          : 'No upcoming events on the board right now.') +
      '</div>' +
    '</div>';
}

function cardHTML(ev, i) {
  /* Same rule as the hero: a clock only when one was published. A row with
     nothing else to say falls back to the feed's date label rather than
     rendering an empty meta line. */
  const lead = ev.multiDay ? '<b>till ' + fmtDayMon(ev.end) + '</b>'
    : ev.startKnown ? '<b>' + fmtTime(ev.start) + '</b>'
    : '';
  const bits = [lead, esc(ev.host), esc(locForDisplay(ev))].filter(Boolean);
  const meta = (bits.length ? bits
    : labelAddsSomething(ev) ? [esc(ev.dateLabel)] : []).join(' · ');
  /* The thumb is structural in the alternating rhythm — always rendered, so
     a photo-less event falls back to the flat placeholder (D-068) instead of
     collapsing the row. */
  const thumb = '<div class="event-card-thumb">' +
    (ev.image ? '<img src="' + esc(ev.image) + '" alt="" onerror="this.remove()">' : '') +
  '</div>';
  const flip = i % 2 === 1;   // every second row swaps image and date
  return '<article class="event-card' + (flip ? ' event-card--flip' : '') +
      '" style="animation-delay:' + (i * 70) + 'ms">' +
    thumb +
    '<div class="event-card-body">' +
      '<h3 class="event-card-title" style="font-size:' + cardTitleSize(ev.title) + 'px">' +
        esc(ev.title) + '</h3>' +
      '<div class="event-card-meta">' + meta + '</div>' +
    '</div>' +
    dateTypeHTML(ev.start) +
  '</article>';
}

function renderHero(featured) {
  const key = featured ? featured.id : '∅';
  const current = document.getElementById('hero-' + state.activeLayer);

  if (state.featuredId === key) {
    current.innerHTML = featured ? heroHTML(featured) : heroEmptyHTML();
    return;                                   // same event — no fade
  }

  const nextName = state.activeLayer === 'a' ? 'b' : 'a';
  const next = document.getElementById('hero-' + nextName);
  next.innerHTML = featured ? heroHTML(featured) : heroEmptyHTML();
  next.classList.add('is-active');
  current.classList.remove('is-active');
  state.activeLayer = nextName;
  state.featuredId = key;
}

function renderGrid(upcoming, extra) {
  const key = upcoming.map(e => e.id).join('|') + '+' + extra;
  if (key === state.gridKey) return;
  state.gridKey = key;

  const grid = document.getElementById('grid');
  const html = upcoming.length
    ? upcoming.map(cardHTML).join('') +
      (extra > 0 ? '<div class="grid-more">+ ' + extra + ' more coming up</div>' : '')
    : '<div class="grid-empty">Nothing else scheduled yet — check back soon.</div>';

  grid.classList.add('is-fading');
  setTimeout(() => {
    grid.innerHTML = html;
    grid.classList.remove('is-fading');
  }, 460);
}

function renderBadge() {
  const badge = document.getElementById('src-badge');
  badge.className = 'src-badge' +
    (state.source === 'demo' ? ' is-demo'
      : (state.source === 'stale' || state.source === 'error') ? ' is-stale' : '');
  badge.textContent = state.source === 'demo' ? 'Demo data'
    : state.source === 'stale' ? 'Offline — last known'
    : state.source === 'error' ? 'Feed unavailable' : '';
}

function renderDetail() {
  const ev = state.rotationEvents[state.storyIndex] || null;
  const key = ev ? ev.id + '|' + state.storyIndex + '|' + state.rotationEvents.length : '∅';
  if (key === state.detailKey) return;
  state.detailKey = key;
  document.getElementById('board-detail').innerHTML =
    detailHTML(ev, state.storyIndex, state.rotationEvents.length);
}

function render() {
  const visible = visibleEvents();
  /* The hero leads on the next single occurrence; multi-day runs stay in the
     lineup (see CONFIG.HERO_SINGLE_ONLY). If everything on the board is a
     run — a quiet week of courses — the first one leads rather than the
     board going blank on a programme that is not empty. */
  const featured = featuredEvent(visible);
  const rest = visible.filter(e => e !== featured);
  state.rotationEvents = rest.slice(0, CONFIG.MAX_CARDS);
  if (state.storyIndex >= state.rotationEvents.length) state.storyIndex = 0;
  renderHero(featured);
  renderGrid(rest.slice(0, CONFIG.MAX_CARDS),
             Math.max(0, rest.length - CONFIG.MAX_CARDS));
  renderDetail();
  renderBadge();
}

/* ── Boards: overview, five short event stories, overview again ───────── */
function showBoard(name) {
  document.querySelectorAll('.board').forEach(b =>
    b.classList.toggle('is-active', b.id === 'board-' + name));
  state.board = name;
}

function startBoards() {
  const pinned = new URLSearchParams(location.search).get('board');
  const requested = pinned === 'now' ? 'detail' : pinned;
  if (requested && CONFIG.AVAILABLE_BOARDS.includes(requested)) {
    showBoard(requested);
    if (requested === 'detail') renderDetail();
    return;
  }
  showBoard('events');
  scheduleNextBoard(CONFIG.OVERVIEW_MS);
}

function scheduleNextBoard(delay) {
  clearTimeout(state.boardTimer);
  state.boardTimer = setTimeout(advanceBoard, delay);
}

function advanceBoard() {
  if (!state.rotationEvents.length) {
    showBoard('events');
    scheduleNextBoard(CONFIG.OVERVIEW_MS);
    return;
  }
  if (state.board === 'events') {
    state.storyIndex = 0;
    state.detailKey = '';
    renderDetail();
    showBoard('detail');
    scheduleNextBoard(CONFIG.DETAIL_MS);
    return;
  }
  if (state.storyIndex < state.rotationEvents.length - 1) {
    state.storyIndex += 1;
    state.detailKey = '';
    renderDetail();
    scheduleNextBoard(CONFIG.DETAIL_MS);
    return;
  }
  state.storyIndex = 0;
  showBoard('events');
  scheduleNextBoard(CONFIG.OVERVIEW_MS);
}

/* ── Clock + live countdown ────────────────────────────────────────────── */
function tickClock() {
  const now = new Date();
  document.getElementById('clock-time').textContent = fmtTime(now.getTime());
  document.getElementById('clock-date').textContent =
    DAYS[now.getDay()].slice(0, 3) + ' ' + now.getDate() + ' ' + MONTHS[now.getMonth()];
  document.querySelectorAll('.js-countdown').forEach(el => {
    el.textContent = fmtHMS(Number(el.dataset.start) - now.getTime());
  });
}

/* ── Stage scaling — fit the 1920×1080 canvas to any output ───────────── */
function fitStage() {
  const vv = window.visualViewport;
  const w = Math.max(
    vv && vv.width ? vv.width : 0,
    document.documentElement.clientWidth || 0,
    window.innerWidth || 0
  );
  const h = Math.max(
    vv && vv.height ? vv.height : 0,
    document.documentElement.clientHeight || 0,
    window.innerHeight || 0
  );
  if (!w || !h) {
    window.setTimeout(fitStage, 250);
    return;
  }
  const s = Math.min(w / 1920, h / 1080) * CONFIG.SAFE_SCALE;
  document.getElementById('stage').style.transform =
    'translate(-50%, -50%) scale(' + s + ')';
}

/* ── Boot ──────────────────────────────────────────────────────────────── */
window.addEventListener('resize', fitStage);
window.addEventListener('load', fitStage);
if (window.visualViewport) window.visualViewport.addEventListener('resize', fitStage);
fitStage();
setTimeout(fitStage, 250);
setTimeout(fitStage, 1000);
setTimeout(fitStage, 3000);
tickClock();
setInterval(tickClock, 1000);
fetchEvents();
startBoards();
setInterval(fetchEvents, CONFIG.POLL_MS);
setInterval(render, CONFIG.SWEEP_MS);   // local expiry sweep between polls

/* QA hooks (harmless in production) */
window.__tv = {
  state,
  showBoard,
  advanceBoard,
  expireFirst() {   // force the featured event to expire → watch the shift
    const v = visibleEvents();
    if (v[0]) { v[0].end = Date.now() - 1; render(); }
  },
  /* __tv.load(payload) — push a feed payload straight in, the way a fetch
     would. Lets a real events.json be checked against this board before it
     is deployed anywhere, without editing CONFIG.API_URL and risking a
     debug URL shipping to the wall. */
  load(payload) {
    state.events = normalize(payload);
    state.source = 'live';
    render();
    return state.events.length;
  }
};
</script>
